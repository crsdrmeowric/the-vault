<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vault // Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="steam-header">
        <div class="top-bar">
            <div class="nav-links">
                <a href="index.html" class="nav-link">STORE</a>
                <a href="library.html" class="nav-link active">LIBRARY</a>
                <a href="community.html" class="nav-link">COMMUNITY</a>
            </div>
            
        </div>
    </header>

    <main class="store-container">
        <div class="library-layout">
            
            <div class="library-sidebar">
                <div class="search-filter">
                    <input type="text" placeholder="Filter by name...">
                </div>
            </div>

            <div class="library-content-pane">
                <h2>DECODE YOUR SECTOR</h2>
                <p>Sign in to view your deployed assets, track installations, and sync your cloud saves.</p>
                
                <div class="auth-actions">
                    <button class="action-btn">SIGN IN</button>
                    <button class="action-btn">SIGN UP</button>
                </div>
            </div>

        </div>
    </main>

    <footer class="steam-footer">
        <button class="footer-btn">+ Add a Game</button>
        <button class="footer-btn">Manage Downloads</button>
        <button class="footer-btn right-btn">Friends & Chat</button>
    </footer>

</body>
</html>
